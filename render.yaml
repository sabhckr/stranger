# Render.com Blueprint: one web service serving the SPA + API + WebSocket, with managed Postgres
# and Redis (Key Value). In Render: New → Blueprint → pick this repository.
# Free plans spin down when idle and the free Postgres expires after a trial period; see
# docs/DEPLOYMENT.md. TURN (needed for video behind strict NATs) is not provided here.
services:
  - type: web
    name: stranger
    runtime: node
    plan: free
    # RENDER_EXTERNAL_URL is available at build time, so the SPA's canonical/OG URLs match the service.
    # --include=dev: Render builds with NODE_ENV=production, which would skip the TypeScript/Vite toolchain.
    buildCommand: npm ci --include=dev --no-audit --no-fund && VITE_SITE_URL=$RENDER_EXTERNAL_URL npm run build
    startCommand: node apps/server/dist/db/migrate.js && node apps/server/dist/index.js
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: TRUST_PROXY
        value: 'true'
      - key: STATIC_DIR
        value: apps/web/dist
      - key: IDENTITY_SECRET
        generateValue: true
      - key: ADMIN_TOKEN
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: stranger-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: stranger-redis
          property: connectionString
      # Lets the GitHub Pages copy of the client talk to this API/WebSocket (the service's own
      # origin is added automatically from RENDER_EXTERNAL_URL).
      # Search engines should treat the always-on GitHub Pages copy as the primary site; this copy
      # declares it as canonical (used at build time by Vite and at runtime by the router).
      - key: VITE_CANONICAL_ROOT
        value: https://sabhckr.github.io/stranger/
      - key: PUBLIC_ORIGINS
        value: https://sabhckr.github.io
      - key: STUN_URLS
        value: stun:stun.l.google.com:19302
      - key: TURN_URLS
        sync: false
      - key: TURN_SECRET
        sync: false
      - key: SITE_URL
        sync: false
  - type: keyvalue
    name: stranger-redis
    plan: free
    ipAllowList: []
databases:
  - name: stranger-db
    plan: free
    databaseName: stranger
    user: stranger
