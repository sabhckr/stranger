# Render.com Blueprint: one web service serving the SPA + API + WebSocket, with managed Postgres
# and Redis (Key Value). In Render: New → Blueprint → pick this repository.
# Free plans spin down when idle and the free Postgres expires after a trial period; see
# docs/DEPLOYMENT.md. TURN (needed for video behind strict NATs) is not provided here.
services:
  - type: web
    name: stranger
    runtime: node
    plan: free
    buildCommand: npm ci --no-audit --no-fund && npm run build
    startCommand: node apps/server/dist/db/migrate.js && node apps/server/dist/index.js
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: TRUST_PROXY
        value: 'true'
      - key: STATIC_DIR
        value: apps/web/dist
      - key: IDENTITY_SECRET
        generateValue: true
      - key: ADMIN_TOKEN
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: stranger-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: stranger-redis
          property: connectionString
      - key: STUN_URLS
        value: stun:stun.l.google.com:19302
      - key: TURN_URLS
        sync: false
      - key: TURN_SECRET
        sync: false
      - key: SITE_URL
        sync: false
  - type: keyvalue
    name: stranger-redis
    plan: free
    ipAllowList: []
databases:
  - name: stranger-db
    plan: free
    databaseName: stranger
    user: stranger
