# Publishes the static web app to GitHub Pages on every push to main.
# The chat server cannot run on Pages: set the repository variables API_BASE and WS_URL
# (Settings → Secrets and variables → Actions → Variables) to a deployed backend, e.g.
#   API_BASE = https://stranger.onrender.com      WS_URL = wss://stranger.onrender.com/ws
# Until then the Pages site shows the landing page with a "chat server not connected" notice.
name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Build web app for Pages
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_SITE_URL: https://${{ github.repository_owner }}.github.io
          VITE_API_BASE: ${{ vars.API_BASE }}
          VITE_WS_URL: ${{ vars.WS_URL }}
        run: npm run build:protocol && npm run build -w apps/web
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
