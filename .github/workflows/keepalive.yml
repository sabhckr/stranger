# Keeps the free Render instance from spinning down by requesting its health endpoint every
# 10 minutes (about 720 instance-hours a month, within Render's 750 free hours for one service).
# Disable this workflow in Actions if you move to a paid instance or want the free hours back.
# GitHub pauses scheduled workflows after 60 days without repository activity.
name: Keep backend awake
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
permissions: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Request /healthz
        env:
          API_BASE: ${{ vars.API_BASE }}
        run: |
          if [ -z "$API_BASE" ]; then echo "API_BASE variable not set"; exit 0; fi
          curl -fsS --max-time 90 "$API_BASE/healthz" && echo " ok"
