# coturn configuration for STRANGER. Credentials are minted per request by the server using the
# shared TURN_SECRET (coturn "REST API" scheme). Replace EXTERNAL_IP / REALM for your host.
listening-port=3478
tls-listening-port=5349
# Set to the server's public IP. In docker-compose this is injected via --external-ip.
# external-ip=203.0.113.10
realm=stranger.local
fingerprint
lt-cred-mech
use-auth-secret
# static-auth-secret is passed on the command line from the TURN_SECRET environment variable.
no-multicast-peers
no-cli
no-tcp-relay
min-port=49160
max-port=49200
# Deny relaying to private networks (prevents using TURN to reach internal services).
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
# TLS (recommended for turns:): mount certificates and uncomment.
# cert=/etc/coturn/certs/fullchain.pem
# pkey=/etc/coturn/certs/privkey.pem
log-file=stdout
verbose
